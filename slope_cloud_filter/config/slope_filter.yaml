slope_cloud_filter:
  ros__parameters:
    # ==================================================
    # Topics
    # ==================================================
    odom_topic: "/Odometry"
    input_cloud_topic: "/cloud_registered_body"
    output_cloud_topic: "/cloud_global_filtered"

    # ==================================================
    # 센서 기하
    # ==================================================
    # BODY 원점에서 지면까지 거리(= LiDAR 설치 높이)
    # 가장 가까운 링의 지면 높이 초기 추정값으로만 사용됨
    lidar_height_m: 0.35

    # odom의 roll/pitch로 중력정렬 후 판정할지 여부
    # odom(FAST-LIO)이 불안정하면 false로 두고 테스트
    use_level_frame: true

    # ==================================================
    # 폴라 그리드
    # ==================================================
    # 방위각 분할 수 (36 = 10도 간격)
    # 스캔 1프레임 포인트가 ~1700개로 희박하므로 셀을 너무 잘게
    # 나누면 셀당 점이 1개 미만이 되어 최저점 추정이 무의미해진다
    azimuth_bins: 36
    # 거리 방향 셀 크기(m)
    radial_bin_size_m: 0.5
    # 처리 거리 범위(m). global costmap의 obstacle_max_range(8.0)보다
    # 넉넉하게 잡아둠
    min_range_m: 0.3
    max_range_m: 15.0

    # ==================================================
    # 지면 추정 / 장애물 판정
    # ==================================================
    # 주행 가능하다고 볼 최대 지면 경사(도)
    # 실제 경사로 각도보다 여유있게 크게 잡아야 함
    # (경사로가 10도면 20도 정도)
    # 너무 크게 잡으면 진짜 벽도 지면으로 흡수될 수 있음
    max_ground_slope_deg: 20.0

    # 셀 간 지면 높이 변화 허용 여유(m). 노이즈 흡수용
    ground_jump_tolerance_m: 0.10

    # 지역 지면보다 이만큼 이상 높아야 장애물로 인정(m)
    # 작으면 노면 요철까지 장애물, 크면 낮은 연석을 놓침
    # 0.20 ~ 0.35 사이에서 현장 튜닝 권장
    obstacle_height_thresh_m: 0.25

    # 지역 지면 기준 이 높이 이상은 무시(m). 나뭇가지/천장 등
    max_obstacle_height_m: 2.0

    # ==================================================
    # 스캔 누적
    # ==================================================
    # /cloud_registered_body는 FAST-LIO의 스캔 매칭용 클라우드라
    # 1프레임 ~1700점으로 매우 성기다. 그 상태로는 먼 거리에
    # 광선을 쏠 점이 없어서 costmap clearing이 로봇 근처에서 끝나고
    # 그 바깥이 unknown(회색)으로 남는다.
    #
    # 최근 N개 스캔을 odom으로 보정해 현재 body frame에 합쳐
    # 밀도를 N배로 올린다.
    #
    #   1 = 누적 안 함
    #   5 = 0.5초분 (10Hz 기준). 권장 시작값
    #   8~10 = 더 조밀하지만 움직이는 물체가 더 번짐
    accumulate_scans: 5

    # 로그 출력 주기(초)
    log_period_sec: 1.0

    # ==================================================
    # 출력 토픽 (marking / clearing 분리)
    # ==================================================
    # costmap raytracing은 2D라서, 원본 클라우드를 clearing에
    # 그대로 쓰면 나무 캐노피로 가는 광선이 그 아래 실제 장애물까지
    # 관통해서 지워버린다. 그래서 "지역 지면 기준 일정 높이 이하"인
    # 점만 모아 clearing 전용으로 발행한다.
    #   - 지면 점 포함  -> 지나온 길이 제대로 clearing 됨
    #   - 캐노피 제외   -> 과잉 clearing 없음
    output_clearing_topic: "/cloud_ground_clearing"
    publish_clearing: true
    # 지면보다 이만큼 아래는 노이즈로 보고 clearing에서도 제외(m)
    clearing_min_height_m: -1.0

    # 디버그: 제거된 점 확인용 토픽 (RViz에서 빨간색으로 표시)
    debug_removed_topic: "/cloud_slope_removed"
    publish_removed: true
