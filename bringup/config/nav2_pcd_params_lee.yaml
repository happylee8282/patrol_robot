# =============================================================================
# nav2 파라미터
#
# [수정 요약]
#  1. local_costmap  : obstacle_layer를 marking / clearing 소스로 분리
#                      토픽을 /cloud_registered_body -> 필터 출력으로 교체
#                      높이 게이팅 해제, 창 크기 3m -> 6m
#  2. global_costmap : 높이 게이팅 해제 (레이어 레벨 포함)
#                      clearing 소스를 /cloud_ground_clearing 으로 지정
#
# [핵심 원칙]
#  높이 판단은 slope_cloud_filter 노드가 "지역 지면 기준 상대 높이"로
#  단독 수행한다. costmap의 min/max_obstacle_height는 map/odom 원점 기준
#  절대 높이라서 경사로에서 반드시 어긋나므로 사실상 무력화(+-100 m)한다.
# =============================================================================

# AMCL: 2D LaserScan과 2D 지도를 이용하는 위치추정 노드입니다.
# 현재 시스템은 FAST-LIO PCD localization을 사용하므로 navigation_launch.py만
# 실행할 때 이 블록은 사용되지 않습니다. AMCL과 FAST-LIO를 동시에 실행하면
# map 계열 TF가 충돌할 수 있으므로 주의합니다.
amcl:
  ros__parameters:
    # false: 실제 시스템 시간 사용, true: rosbag/Gazebo의 /clock 사용
    use_sim_time: false
    # 차동구동 오도메트리 운동 모델의 회전/직진 오차 계수
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # AMCL이 로봇 본체로 간주할 TF 프레임
    base_frame_id: "base_footprint"
    # Beam skipping 관련 임계값. do_beamskip=false이면 아래 값들은 사용되지 않음
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    # AMCL이 위치를 추정할 전역 프레임
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # LaserScan 유효 거리. -1은 센서 메시지의 최소 거리 사용
    laser_max_range: 100.0
    laser_min_range: -1.0
    # likelihood_field: 지도 장애물과 Scan 사이 거리로 관측 확률 계산
    laser_model_type: "likelihood_field"
    # Scan 한 프레임에서 사용할 최대 beam 개수
    max_beams: 60
    # 파티클 필터의 최대/최소 파티클 수
    max_particles: 2000
    min_particles: 500
    # AMCL이 사용하는 로컬 오도메트리 TF 프레임
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # 차동구동 로봇 운동 모델
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    # true이면 AMCL이 map->odom TF를 발행함. FAST-LIO와 동시 사용 금지
    tf_broadcast: true
    transform_tolerance: 1.0
    # 이 각도/거리 이상 움직였을 때 AMCL 위치 업데이트 수행
    update_min_a: 0.2
    update_min_d: 0.25
    # LaserScan 관측 모델 각 성분의 가중치
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # AMCL이 구독할 LaserScan 토픽
    scan_topic: scan

# BT Navigator: 목표를 받아 경로 계획, 추종, 복구 동작을 Behavior Tree로 조율합니다.
bt_navigator:
  ros__parameters:
    # 실제 로봇이므로 시스템 시간 사용
    use_sim_time: false
    # Navigation 목표와 전역 경로를 표현하는 기준 프레임
    global_frame: map
    # FAST-LIO가 발행하는 로봇 본체 프레임
    robot_base_frame: base_link
    # FAST-LIO Odometry 메시지 토픽(프레임 이름이 아니라 토픽 이름)
    odom_topic: /odom_2d
    # Behavior Tree 반복 주기(ms)와 action/service 응답 제한시간(ms)
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # BT XML에서 사용할 수 있는 action/condition/control 플러그인 목록
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# NavigateThroughPoses action 전용 내부 BT 노드 시간 설정
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# NavigateToPose action 전용 내부 BT 노드 시간 설정
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# Controller Server: 전역 경로를 따라갈 속도 명령(cmd_vel)을 계산합니다.
controller_server:
  ros__parameters:
    use_sim_time: false
    # 속도/정지 상태 판단에 사용할 FAST-LIO Odometry 토픽
    odom_topic: /odom_2d
    # Local controller 실행 주파수(Hz)
    controller_frequency: 20.0
    # 이 값보다 작은 속도는 0으로 취급하는 임계값
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # controller 실패 후 허용할 시간(초)
    failure_tolerance: 0.3
    # 진행 여부, 목표 도착 여부, 경로 추종에 사용할 플러그인 이름
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    # Progress checker: 지정 시간 동안 충분히 움직였는지 검사
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker: 목표 도착으로 판단할 위치/방향 허용 오차
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  _goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.4
    # TEB Local Planner: 시간, 장애물 거리, 로봇 운동학을 동시에 최적화
    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      # TF / Odometry
      odom_topic: /odom_2d

      # Trajectory
      teb_autosize: 1.0
      dt_ref: 0.4
      dt_hysteresis: 0.03
      min_samples: 10
      max_samples: 100
      global_plan_overwrite_orientation: true
      allow_init_with_backwards_motion: false
      global_plan_viapoint_sep: -0.1
      via_points_ordered: false
      max_global_plan_lookahead_dist: 5.0
      global_plan_prune_distance: 1.0
      exact_arc_length: false
      force_reinit_new_goal_dist: 1.0
      force_reinit_new_goal_angular: 1.57
      feasibility_check_no_poses: 5
      feasibility_check_lookahead_distance: -1.0
      control_look_ahead_poses: 1
      publish_feedback: false

      # Robot: 기존 DWB와 동일한 차동구동 속도/가속도 제한
      max_vel_x: 0.3
      max_vel_x_backwards: 0.05
      max_vel_y: 0.0
      max_vel_theta: 2.0
      acc_lim_x: 0.05
      acc_lim_y: 0.0
      acc_lim_theta: 0.1
      min_turning_radius: 0.0
      wheelbase: 0.0
      cmd_angle_instead_rotvel: false
      is_footprint_dynamic: false

      # TEB 최적화에 사용할 선분 형상(전방 0.4 m, 후방 0.6 m)
      footprint_model.type: "line"
      footprint_model.line_start: [0.4, 0.0]
      footprint_model.line_end: [-0.6, 0.0]

      # Goal velocity. 최종 도착 판정은 general_goal_checker가 담당
      free_goal_vel: false

      # Obstacles
      min_obstacle_dist: 0.7
      inflation_dist: 0.25
      dynamic_obstacle_inflation_dist: 0.6
      include_costmap_obstacles: true
      include_dynamic_obstacles: true
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 30
      legacy_obstacle_association: true
      obstacle_association_force_inclusion_factor: 1.5
      obstacle_association_cutoff_factor: 5.0

      # Humble 포트의 cleanup null-pointer 문제를 피하고 장애물 셀을 polygon으로 변환
      costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
      costmap_converter_spin_thread: true

      # Optimization
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.01
      weight_max_vel_x: 2.0
      weight_max_vel_y: 0.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_y: 0.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 10.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 10.0
      weight_shortest_path: 0.0
      weight_obstacle: 50.0
      weight_inflation: 0.1
      weight_dynamic_obstacle: 10.0
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 1.0
      weight_adapt_factor: 2.0

      # 첫 주행은 단일 TEB로 안정성을 확인한 후 homotopy를 활성화
      enable_homotopy_class_planning: false
      enable_multithreading: true
      max_number_classes: 8
      selection_cost_hysteresis: 1.0
      selection_obst_cost_scale: 100.0
      selection_viapoint_cost_scale: 1.0
      selection_alternative_time_cost: true
      roadmap_graph_samples: 15
      roadmap_graph_area_width: 6.0
      h_signature_prescaler: 1.0
      h_signature_threshold: 0.1
      visualize_hc_graph: false
      viapoints_all_candidates: true
      switching_blocking_period: 0.0

      # Recovery
      shrink_horizon_backup: true
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: true
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
      divergence_detection_enable: true
      divergence_detection_max_chi_squared: 10

# =============================================================================
# Local Costmap: 로봇 주변의 짧은 범위에서 실시간 장애물을 관리합니다.
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      # Costmap 갱신 주기와 ROS 토픽 발행 주기(Hz)
      update_frequency: 5.0
      publish_frequency: 2.0
      # FAST-LIO의 연속적인 로컬 오도메트리 프레임
      global_frame: odom
      # Costmap에서 로봇 중심으로 사용할 프레임
      robot_base_frame: base_link
      use_sim_time: false
      # true: 로봇을 따라 Costmap 창이 이동함 (잔상이 자동으로 밀려나감)
      rolling_window: true
      # [수정] 3m -> 6m
      # robot_radius 0.4 + inflation_radius 0.6 이면 3m 창(반경 1.5m)에는
      # 회피할 여유 공간이 거의 남지 않습니다.
      width: 6
      height: 6
      # 셀 한 칸 크기(m), 0.05는 5cm
      resolution: 0.05
      # 원형 로봇 반지름
      #footprint: "[[0.42, 0.24], [0.42, -0.24],[-0.42, -0.24],[-0.42, 0.24]]"
      robot_radius: 0.5
      # 실제로 로딩할 레이어와 적용 순서
      plugins: ["obstacle_layer", "inflation_layer"]

      # 장애물 주변에 안전 비용 영역을 생성하는 레이어
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 값이 클수록 장애물에서 멀어질 때 비용이 빠르게 감소
        cost_scaling_factor: 1.0
        # 장애물로부터 비용을 확장할 최대 거리(m)
        inflation_radius: 1.0

      # -----------------------------------------------------------------------
      # [수정] PointCloud2 장애물 레이어
      #
      #  - 토픽을 원본(/cloud_registered_body)에서 필터 출력으로 교체.
      #    원본을 쓰면 로봇이 경사로에 진입하는 순간 경사면이 local costmap에
      #    벽으로 찍혀서, 전역 경로는 뚫려 있어도 DWB가 못 나갑니다.
      #  - marking / clearing 소스 분리.
      #    필터가 지면 점을 지우면 "바닥을 쓸어주던 광선"도 같이 사라져서
      #    지나온 길의 잔상이 안 지워집니다. 그래서 clearing은 지면이 포함된
      #    /cloud_ground_clearing 을 씁니다.
      #  - 높이 게이팅 해제(+-100 m).
      #    이 값은 costmap의 global_frame(여기서는 odom) 원점 기준 절대
      #    높이라서, 로봇이 경사로를 오르면 주변 모든 점이 범위 밖으로
      #    나가버려 마킹도 clearing도 전부 사라집니다.
      #    높이 판단은 slope_cloud_filter 노드가 지역 지면 기준으로 수행합니다.
      # -----------------------------------------------------------------------
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        # 레이어 레벨 게이팅도 반드시 함께 풀어야 합니다
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        # clearing: 빈 공간 제거, marking: 장애물 등록
        observation_sources: marking_source clearing_source

        marking_source:
          topic: /cloud_global_filtered
          data_type: "PointCloud2"
          sensor_frame: body
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          obstacle_min_range: 0.3
          obstacle_max_range: 6.0
          raytrace_min_range: 0.3
          raytrace_max_range: 8.0
          marking: true
          clearing: false
          inf_is_valid: false

        clearing_source:
          topic: /cloud_ground_clearing
          data_type: "PointCloud2"
          sensor_frame: body
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          obstacle_min_range: 0.3
          obstacle_max_range: 6.0
          raytrace_min_range: 0.3
          raytrace_max_range: 8.0
          marking: false
          clearing: true
          inf_is_valid: false

      # 현재 plugins 목록에 static_layer가 없으므로 이 설정은 로딩되지 않음
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # 매 발행마다 전체 Costmap을 보낼지 여부
      always_send_full_costmap: True

# =============================================================================
# Global Costmap: 2D 정적 지도 전체와 실시간 장애물로 전역 경로를 계산합니다.
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      # [수정] 1.0 -> 5.0
      # 1Hz면 10Hz로 들어오는 클라우드 중 10개에 1개만 처리하므로
      # 마킹/클리어링 기회가 크게 줄어듭니다.
      update_frequency: 5.0
      publish_frequency: 1.0
      # 전역 지도 기준 프레임과 로봇 본체 프레임
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # [추가] map->odom이 ICP 기반이라 갱신이 느립니다.
      # 기본값 0.3초면 그 사이 클라우드가 TF 지연으로 전부 버려집니다.
      transform_tolerance: 1.0
      # 원형 로봇 반지름과 Costmap 해상도
      robot_radius: 0.5
      #footprint: "[[0.42, 0.24], [0.42, -0.24],[-0.42, -0.24],[-0.42, 0.24]]"
      resolution: 0.05

      # [수정] true -> false
      #
      # true이면 관측되지 않은 영역이 unknown(255)으로 남고,
      # planner의 allow_unknown이 false이므로 장애물과 똑같이
      # "통과 불가"가 됩니다. RViz에서 회색으로 보이면서 못 가는
      # 영역이 바로 이것입니다.
      #
      # false로 두면 지도상 unknown 셀을 FREE로 취급하므로
      # 회색 영역이 사라지고 계획이 통과합니다.
      # 실제 장애물은 obstacle_layer가 마킹하고,
      # 근접 안전은 local costmap이 담당합니다.
      track_unknown_space: false

      # Static Map -> 실시간 장애물 -> Inflation 순서로 합성
      #
      # 참고: 정적 맵만으로 전역 계획이 충분하다면
      #       plugins에서 obstacle_layer를 빼는 것이 가장 단순합니다.
      #       (오르막 가짜 벽 / 동적 장애물 잔상 문제가 원천 차단됨.
      #        동적 장애물은 rolling window인 local costmap이 담당)
      #       그 경우: plugins: ["static_layer", "inflation_layer"]
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # -----------------------------------------------------------------------
      # [수정] FAST-LIO PointCloud로 동적 장애물을 추가하고 제거하는 레이어
      #        (수정 이유는 local_costmap의 obstacle_layer 주석 참고)
      # -----------------------------------------------------------------------
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        # 레이어 레벨 게이팅 해제
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        observation_sources: marking_source clearing_source

        # 마킹 전용: 지면/경사면이 제거된 필터 출력
        marking_source:
          topic: /cloud_global_filtered
          data_type: "PointCloud2"
          sensor_frame: body
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          obstacle_min_range: 0.3
          obstacle_max_range: 8.0
          raytrace_min_range: 0.3
          raytrace_max_range: 10.0
          marking: true
          clearing: false
          inf_is_valid: false

        # 클리어링 전용: 지면 포함, 캐노피 제외
        # (원본을 그대로 쓰면 2D raytracing이 나무 위로 가는 광선으로
        #  그 아래 실제 장애물까지 지워버립니다)
        clearing_source:
          topic: /cloud_ground_clearing
          data_type: "PointCloud2"
          sensor_frame: body
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          obstacle_min_range: 0.3
          obstacle_max_range: 8.0
          raytrace_min_range: 0.3
          raytrace_max_range: 12.0
          marking: false
          clearing: true
          inf_is_valid: false

      # Map Server의 /map OccupancyGrid를 받는 정적 지도 레이어
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # 늦게 시작해도 Map Server의 마지막 지도를 받을 수 있도록 설정
        map_subscribe_transient_local: True

      # 전역 지도 장애물 주변의 안전 비용 영역
      #
      # 참고: inflation_radius(0.4)가 robot_radius(0.4)와 같아 여유가 없습니다.
      #       좁은 통로 통과가 목적이면 현재 값이 맞고,
      #       안전 여유가 필요하면 0.55~0.7로 올리세요.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.1
        inflation_radius: 0.4
      always_send_full_costmap: True

# Map Server: PNG/PGM + YAML 2D 지도를 /map OccupancyGrid로 발행합니다.
# 현재는 별도 ros2 run 명령의 yaml_filename 파라미터로 지도 경로를 전달합니다.
map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

# Map Saver: 현재 /map OccupancyGrid를 이미지와 YAML로 저장합니다.
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# Planner Server: Global Costmap 위에서 시작점부터 목표점까지 전역 경로를 만듭니다.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    # 사용할 전역 경로 플래너 목록
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn 기반 grid planner
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 목표가 막혀 있을 때 허용할 주변 거리(m)
      tolerance: 0.5
      # false: Dijkstra, true: A* 사용
      use_astar: false
      # [수정] false -> true
      #
      # global_costmap의 track_unknown_space를 false로 바꿔서
      # 원칙적으로는 unknown 셀이 생기지 않지만,
      # 지도 경계 밖 등에서 남을 수 있으므로 함께 허용합니다.
      allow_unknown: true

# Smoother Server: 격자형 전역 경로의 꺾임을 부드럽게 다듬습니다.
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # 최적화 종료 허용 오차, 최대 반복 수, 추가 refinement 여부
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# Behavior Server: 회전, 후진, 대기 등 Navigation 복구/보조 동작을 실행합니다.
behavior_server:
  ros__parameters:
    # 복구 동작이 사용할 Local Costmap과 로봇 footprint 토픽
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    # Behavior 실행 주기(Hz)와 사용할 동작 플러그인 목록
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    # 복구 동작의 기준 프레임과 로봇 프레임
    global_frame: odom
    robot_base_frame: base_link
    # TF 허용 지연, 전방 시뮬레이션 시간, 회전 속도/가속도 제한
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# Robot State Publisher 시간 설정. URDF가 별도로 제공될 때 TF를 발행합니다.
robot_state_publisher:
  ros__parameters:
    use_sim_time: false

# Waypoint Follower: 여러 목표점을 순서대로 방문합니다.
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    # 하나의 waypoint 실패 시 전체 작업을 중단할지 여부
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      # waypoint 도착 후 대기 시간(ms)
      waypoint_pause_duration: 200

# Velocity Smoother: Controller의 cmd_vel을 가감속 제한에 맞게 부드럽게 만듭니다.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # 속도 보간/발행 주파수(Hz)
    smoothing_frequency: 20.0
    # false이면 각 축 속도를 독립적으로 제한
    scale_velocities: False
    # OPEN_LOOP: 이전 출력 명령 기준, CLOSED_LOOP: Odometry 피드백 기준
    feedback: "OPEN_LOOP"
    # [x 선속도, y 선속도, z 각속도] 최대/최소값
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.4, 0.0, -1.0]
    # [x, y, theta] 가속/감속 한계
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    # CLOSED_LOOP 사용 시 피드백에 사용할 FAST-LIO Odometry 토픽
    odom_topic: "/odom_2d"
    # Odometry가 유효하다고 판단할 최대 시간(초)
    odom_duration: 0.1
    # 이 값보다 작은 속도는 0으로 처리
    deadband_velocity: [0.0, 0.0, 0.0]
    # 새 cmd_vel이 없을 때 정지시키는 제한시간(초)
    velocity_timeout: 1.0
