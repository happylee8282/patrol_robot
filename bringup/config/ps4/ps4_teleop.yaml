joy_node:
  ros__parameters:
    deadzone: 0.05
    autorepeat_rate: 20.0
    coalesce_interval_ms: 1

ps4_latched_control:
  ros__parameters:
    # 왼쪽 스틱: 위/아래 전후진, 좌/우 제자리 회전
    linear_axis: 1
    angular_axis: 0
    # 일반적인 Linux joy 매핑: A=0, B=1, X=2
    # A: Auto(1), B: Manual(0), X: 정지
    auto_button: 0
    manual_button: 1
    stop_button: 2
    axis_threshold: 0.6
    linear_speed: 0.35
    angular_speed: 0.8
    publish_rate: 20.0
    cmd_vel_topic: /cmd_vel
    navigation_actions:
      - /navigate_to_pose
      - /navigate_through_poses
